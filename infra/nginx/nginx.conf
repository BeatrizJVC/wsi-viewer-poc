# Reverse proxy temporal para exponer Orthanc DICOMweb
# desde WSL, agregando CORS para el frontend desplegado en Vercel.
# Backend esperado: túnel SSH local en 127.0.0.1:8044.
pid /tmp/nginx-wsi.pid;
error_log /tmp/nginx-wsi-error.log;

events {}

http {
    access_log /tmp/nginx-wsi-access.log;

    server {
        listen 8050;

        location /dicom-web/ {

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, Range";
                add_header Access-Control-Max-Age 86400;
                return 204;
            }

            limit_except GET HEAD OPTIONS {
                deny all;
            }

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type" always;

            proxy_pass http://127.0.0.1:8044;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Forwarded "proto=https;host=$host";

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location / {
            return 404;
        }
    }
}